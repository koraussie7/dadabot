version: '3.8'

services:
  minima:
    build:
      context: ./minima
      dockerfile: Dockerfile
    container_name: muhanai-minima
    ports:
      - "9001:9001"  # RPC
      - "9002:9002"  # WebSocket
      - "9003:9003"  # MDS
    volumes:
      - minima-data:/root/muhanai-data
      - ./config/muhanai-conf.yaml:/opt/minima/minima-conf.yaml:ro
      - ./minima/minidapps/muhanai-anchor:/opt/minima/minidapps/muhanai-anchor:ro
    environment:
      - MINIMA_PASSWORD=${MINIMA_PASSWORD:-changeme}
      - JAVA_OPTS=-Xmx2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/rpc"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  minima-data:
    driver: local

networks:
  default:
    name: muhanai-network