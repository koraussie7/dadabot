# Cargo.toml
[package]
name = "dadabot-mobile"
version = "0.1.0"
description = "DadaBot Mobile - Local-first AI Agent OS"
authors = ["DadaBot Team"]
edition = "2021"
license = "MIT"

[lib]
name = "dadabot_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[features]
tauri-mobile = []
default = ["tauri-mobile"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [
  "fs",
  "http",
  "shell",
  "notification",
  "local-notification",
  "biometric",
  "clipboard",
  "opener",
  "mobile",
  "dialog"
] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-local-notification = "2"
tauri-plugin-biometric = "2"
tauri-plugin-clipboard = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }