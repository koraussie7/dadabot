<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DadaBot" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>DadaBot Mobile</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a1a; 
        color: #fff; 
        min-height: 100vh;
        overflow: hidden;
      }
      #app { width: 100%; height: 100vh; }
      .loading { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        height: 100vh; 
        gap: 1rem;
      }
      .spinner { 
        width: 40px; 
        height: 40px; 
        border: 3px solid #333; 
        border-top-color: #6366f1; 
        border-radius: 50%; 
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loading-text { color: #888; font-size: 0.9rem; }
      .error { color: #ef4444; padding: 1rem; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">DadaBot을 불러오는 중...</div>
      </div>
      <div id="error" class="error" style="display: none;"></div>
    </div>
    <script type="module">
      // Tauri 모바일 환경 감지
      const isTauri = typeof window.__TAURI__ !== 'undefined';
      
      async function init() {
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const app = document.getElementById('app');
        
        try {
          // Tauri 환경에서 네이티브 기능 초기화
          if (isTauri) {
            const { invoke } = await import('https://cdn.jsdelivr.net/npm/@tauri-apps/api@2');
            
            // 기기 정보 확인
            try {
              const info = await invoke('get_device_info');
              console.log('Device info:', info);
            } catch (e) {
              console.warn('Device info unavailable:', e);
            }
            
            // 생체 인증 테스트
            try {
              await invoke('biometric_auth', { reason: 'DadaBot에 로그인합니다' });
            } catch (e) {
              console.log('Biometric auth not available:', e);
            }
          }
          
          // 웹 앱 iframe 로드 (로컬 웹 앱 또는 CDN)
          const webAppUrl = isTauri 
            ? 'https://dadabot.dev'  // 프로덕션: CDN
            : 'http://localhost:5173'; // 개발: 로컬 Vite 서버
          
          // iframe으로 웹 앱 임베드 (모바일에서는 전체 화면)
          app.innerHTML = `
            <iframe 
              src="${webAppUrl}" 
              style="width:100%;height:100%;border:none;background:#1a1a1a;"
              allow="camera; microphone; geolocation; clipboard-read; clipboard-write"
              sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-storage-access-by-user-activation"
            ></iframe>
          `;
          
          loading.style.display = 'none';
          
        } catch (err) {
          console.error('Init error:', err);
          loading.style.display = 'none';
          errorDiv.textContent = '초기화 실패: ' + err.message;
          errorDiv.style.display = 'block';
        }
      }
      
      // Tauri 준비 대기
      if (isTauri) {
        document.addEventListener('DOMContentLoaded', () => {
          // @tauri-apps/api가 주입될 때까지 대기
          const checkTauri = setInterval(() => {
            if (window.__TAURI__) {
              clearInterval(checkTauri);
              init();
            }
          }, 100);
        });
      } else {
        // 웹 브라우저에서 직접 실행
        init();
      }
    </script>
  </body>
</html>
