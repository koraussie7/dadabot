name: dadaobot
title: DadaBot
summary: Local-first AI Agent OS — multi-model router, human-in-the-loop safety, block canvas
description: |
  DadaBot is a local-first AI Agent OS that integrates:
   - 44 free models via sam-tools (no API key required)
   - 186 tools across the sam-tools catalog
   - Human-in-the-loop safety via busabase-adapter (3-tier permissions)
   - Block-based visual canvas via BlockSuite-compatible API
   - 5-stage safety pipeline: ingest → decide → submit → await → complete

  Install with `snap install dadaobot` or one-liner:
    curl -fsSL https://dadabot.dev/install.sh | bash

version: "0.1.0-beta.1"
grade: stable
confinement: strict
base: core22

compression: lzo

apps:
  dadaobot:
    command: usr/bin/dadabot
    daemon: simple
    daemon-options:
      - foreground
    plugs:
      - home
      - network
      - network-bind
      - opengl

parts:
  dadabot:
    plugin: nil
    source: .
    source-type: local
    build-packages:
      - libc6-dev
    stage-packages:
      - libssl3
    override-build: |
      set -eux
      mkdir -p $CRAFT_PART_INSTALL/usr/bin $CRAFT_PART_INSTALL/usr/share/doc/dadaobot
      install -m 0755 bin/dadabot $CRAFT_PART_INSTALL/usr/bin/dadabot
      install -m 0755 bin/dadabot-shim $CRAFT_PART_INSTALL/usr/bin/dadabot-shim
      cp -R share/install-scripts $CRAFT_PART_INSTALL/usr/share/dadaobot/install-scripts
      cp README.md $CRAFT_PART_INSTALL/usr/share/doc/dadaobot/README.md
