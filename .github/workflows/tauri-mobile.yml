# =============================================================================
# DadaBot — Tauri Mobile CI/CD
# Builds iOS and Android apps on every push to main and release tags
# =============================================================================
name: Tauri Mobile Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        default: "both"
        type: choice
        options: [android, ios, both]

permissions:
  contents: write

concurrency:
  group: tauri-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C strip=symbols"

jobs:
  # =============================================================================
  # Android Build
  # =============================================================================
  android:
    name: Android (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    if: ${{ github.event.inputs.platform != 'ios' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      # pnpm BEFORE setup-node: setup-node with cache: "pnpm" resolves the
      # package manager during setup and aborts with "Unable to locate
      # executable file: pnpm" when it is not on PATH yet. The old ordering
      # killed every tagged build in ~40s.
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # The lockfile lives in web-app/ (pnpm-workspace root), not at the
          # repo root; without cache-dependency-path setup-node searches the
          # repo root and aborts with "Dependencies lock file is not found".
          cache-dependency-path: web-app/pnpm-lock.yaml
          cache: "pnpm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          emulator: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "web-app/tauri-mobile/src-tauri"
          shared-key: android-${{ matrix.arch }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Install Node deps
        run: |
          # pnpm-workspace root is web-app/ — that is where pnpm-lock.yaml
          # lives. Installing from web-app/tauri-mobile aborted with
          # ERR_PNPM_NO_LOCKFILE in CI (the lockfile is untracked there).
          cd web-app
          pnpm install --frozen-lockfile

      - name: Build Android (${{ matrix.arch }})
        env:
          TAURI_ANDROID_TARGET: ${{ matrix.arch }}
        run: |
          cd web-app/tauri-mobile
          pnpm run tauri:android build --target ${{ matrix.arch }}

      - name: Upload Android artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: dadabot-android-${{ matrix.arch }}
          path: |
            web-app/tauri-mobile/src-tauri/gen/android/app/build/outputs/**/*.apk
            web-app/tauri-mobile/src-tauri/gen/android/app/build/outputs/**/*.aab
          retention-days: 30

  # =============================================================================
  # iOS Build (macOS only)
  # =============================================================================
  ios:
    name: iOS (${{ matrix.arch }})
    runs-on: macos-14
    if: ${{ github.event.inputs.platform != 'android' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      # pnpm BEFORE setup-node: setup-node with cache: "pnpm" resolves the
      # package manager during setup and aborts with "Unable to locate
      # executable file: pnpm" when it is not on PATH yet. The old ordering
      # killed every tagged build in ~40s.
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # The lockfile lives in web-app/ (pnpm-workspace root), not at the
          # repo root; without cache-dependency-path setup-node searches the
          # repo root and aborts with "Dependencies lock file is not found".
          cache-dependency-path: web-app/pnpm-lock.yaml
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-ios
            x86_64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "web-app/tauri-mobile/src-tauri"
          shared-key: ios-${{ matrix.arch }}

      - name: Install Node deps
        run: |
          # pnpm-workspace root is web-app/ — that is where pnpm-lock.yaml
          # lives. Installing from web-app/tauri-mobile aborted with
          # ERR_PNPM_NO_LOCKFILE in CI (the lockfile is untracked there).
          cd web-app
          pnpm install --frozen-lockfile

      - name: Build iOS (${{ matrix.arch }})
        env:
          TAURI_IOS_TARGET: ${{ matrix.arch }}
        run: |
          cd web-app/tauri-mobile
          pnpm run tauri:ios build --target ${{ matrix.arch }}

      - name: Upload iOS artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: dadabot-ios-${{ matrix.arch }}
          path: |
            web-app/tauri-mobile/src-tauri/gen/ios/build/Release-iphoneos/*.ipa
            web-app/tauri-mobile/src-tauri/gen/ios/build/Release-iphonesimulator/*.app
          retention-days: 30

  # =============================================================================
  # Release (on tag push)
  # =============================================================================
  release:
    name: Create Release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dadabot-android-*
          path: dist/android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dadabot-ios-*
          path: dist/ios

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: DadaBot Mobile ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-nightly') }}
          draft: true
          files: |
            dist/android/**/*.apk
            dist/android/**/*.aab
            dist/ios/**/*.ipa
            dist/ios/**/*.app

      - name: Summary
        run: |
          echo "## DadaBot Mobile Release" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Android: ${{ needs.android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "iOS: ${{ needs.ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts uploaded to GitHub Release (draft)" >> $GITHUB_STEP_SUMMARY